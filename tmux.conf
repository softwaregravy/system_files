# Keep Ctrl-a prefix (screen muscle memory)
set -g prefix C-a
unbind C-b
bind a send-prefix

# Proper color support — fixes zsh plugin issues
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Large scrollback
set -g history-limit 50000

# Mouse support
# Tip: hold ⌥ Option while dragging in iTerm2 to bypass tmux and use native selection (highlight persists)
set -g mouse on

# Window nav — both C-a n and C-a C-n work (screen muscle memory)
bind n next-window
bind C-n next-window
bind p previous-window
bind C-p previous-window

# New window — both C-a c and C-a C-c work
bind c new-window
bind C-c new-window

# macOS clipboard integration
set -g set-clipboard on
setw -g mode-keys vi

# Copy mode → macOS clipboard via pbcopy
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"

# Paste tmux buffer (Cmd+V from iTerm also works)
bind P paste-buffer

# Status bar
set -g status-right " #(date +%H:%M) "
