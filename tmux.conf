# Keep Ctrl-a prefix (screen muscle memory)
set -g prefix C-a
unbind C-b
bind a send-prefix

# Proper color support — fixes zsh plugin issues
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Large scrollback
set -g history-limit 50000

# Mouse support
set -g mouse on

# Window nav — both C-a n and C-a C-n work (screen muscle memory)
bind n next-window
bind C-n next-window
bind p previous-window
bind C-p previous-window

# New window — both C-a c and C-a C-c work
bind c new-window
bind C-c new-window

# macOS clipboard integration (OSC 52, works with iTerm2)
set -g set-clipboard on

# Status bar
set -g status-right " #(date +%H:%M) "
